<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhytoSense Mesh Sim</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #ddd; font-family: monospace; }
  #header { padding: 10px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
            display: flex; align-items: baseline; gap: 16px; }
  #header h1 { font-size: 16px; color: #ccc; }
  #status { font-size: 11px; color: #666; }
  #main { display: flex; height: calc(100vh - 40px); }
  #canvas-wrap { flex: 1; overflow: hidden; position: relative; }
  svg { width: 100%; height: 100%; }
  #panel { width: 220px; background: #141414; border-left: 1px solid #2a2a2a;
           overflow-y: auto; padding: 8px; }
  .node-row { padding: 5px 6px; border-radius: 4px; margin-bottom: 3px;
              cursor: pointer; border: 1px solid #222; font-size: 11px; }
  .node-row:hover { border-color: #444; }
  .node-row.dead { opacity: 0.35; }
  .node-val { color: #888; }
  .btn { font-size: 10px; padding: 2px 6px; border: 1px solid #444;
         background: #222; color: #bbb; border-radius: 3px; cursor: pointer; }
  .btn:hover { background: #333; }
  #panel-title { font-size: 10px; color: #555; margin-bottom: 6px; text-transform: uppercase; }
</style>
</head>
<body>

<div id="header">
  <h1>PhytoSense — gradient mesh sim</h1>
  <span id="status">connecting…</span>
</div>

<div id="main">
  <div id="canvas-wrap">
    <svg id="svg" viewBox="0 0 1100 560">
      <defs>
        <marker id="arr" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto">
          <path d="M0,0 L0,4 L4,2 z" fill="#555"/>
        </marker>
      </defs>

      <!-- Background greenhouse outlines -->
      <!-- Romeo: x=[0..15m], y=[-4.5..4.5m]  → svg x=[550..1150], y=[105..495] but clamp to 1100 -->
      <rect x="555" y="130" width="525" height="300" rx="8"
            fill="none" stroke="#1a3a1a" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="810" y="122" fill="#1a4a1a" font-size="11" text-anchor="middle">Romeo (tropical)</text>

      <!-- Julia: x=[-1..-12m], y=[-4..4m] → svg x=[505..20] -->
      <rect x="30" y="130" width="505" height="300" rx="8"
            fill="none" stroke="#1a1a3a" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="285" y="122" fill="#1a1a4a" font-size="11" text-anchor="middle">Julia (mediterranean)</text>

      <!-- Walkway label -->
      <text x="550" y="555" fill="#333" font-size="10" text-anchor="middle">walkway / hub</text>

      <g id="links"></g>
      <g id="nodes"></g>
      <g id="anims"></g>
    </svg>
  </div>

  <div id="panel">
    <div id="panel-title">Nodes</div>
    <div id="node-list"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Topology (mirrors topology.h; x/y in metres)
// ---------------------------------------------------------------------------
const TOPOLOGY = {
   0: {x:  0.0, y:  0.0, g: 0, loc: 'H'},
   1: {x:  2.5, y:  1.5, g: 1, loc: 'R'},  2: {x:  2.5, y: -1.5, g: 1, loc: 'R'},
   3: {x:  5.5, y:  3.0, g: 2, loc: 'R'},  4: {x:  5.5, y:  1.0, g: 2, loc: 'R'},
   5: {x:  5.5, y: -1.0, g: 2, loc: 'R'},  6: {x:  5.5, y: -3.0, g: 2, loc: 'R'},
   7: {x:  9.0, y:  3.5, g: 3, loc: 'R'},  8: {x:  9.0, y:  1.2, g: 3, loc: 'R'},
   9: {x:  9.0, y: -1.2, g: 3, loc: 'R'}, 10: {x:  9.0, y: -3.5, g: 3, loc: 'R'},
  11: {x: 13.0, y:  1.5, g: 4, loc: 'R'}, 12: {x: 13.0, y: -1.5, g: 4, loc: 'R'},
  13: {x: -2.5, y:  1.5, g: 1, loc: 'J'}, 14: {x: -2.5, y: -1.5, g: 1, loc: 'J'},
  15: {x: -5.5, y:  2.5, g: 2, loc: 'J'}, 16: {x: -5.5, y:  0.0, g: 2, loc: 'J'},
  17: {x: -5.5, y: -2.5, g: 2, loc: 'J'},
  18: {x: -9.0, y:  2.0, g: 3, loc: 'J'}, 19: {x: -9.0, y:  0.0, g: 3, loc: 'J'},
  20: {x: -9.0, y: -2.0, g: 3, loc: 'J'},
};

// Gradient colours
const G_COLOUR = ['#888888','#2ecc71','#f39c12','#e74c3c','#9b59b6'];

// SVG coordinate mapping: 1 m = 38 px, hub at (550, 280)
const CX = 550, CY = 280, SCALE = 38;
const sx = x => CX + x * SCALE;
const sy = y => CY - y * SCALE;

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const nodeState = {};  // nid → {alive, t, h, s, hops, svgEl, panelEl}
const linkMap   = {};  // "A-B" → svgEl
let   ws        = null;

// ---------------------------------------------------------------------------
// SVG helpers
// ---------------------------------------------------------------------------
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ---------------------------------------------------------------------------
// Build initial SVG from topology
// ---------------------------------------------------------------------------
function buildGraph(links) {
  const linksG = document.getElementById('links');
  const nodesG = document.getElementById('nodes');

  // Links first (behind nodes)
  for (const lk of links) {
    const a = TOPOLOGY[lk.from], b = TOPOLOGY[lk.to];
    const opacity = Math.max(0.08, Math.min(0.55, (lk.rssi + 75) / 30));
    const el = svgEl('line', {
      x1: sx(a.x), y1: sy(a.y), x2: sx(b.x), y2: sy(b.y),
      stroke: '#448844', 'stroke-width': 1.2, opacity,
    });
    linksG.appendChild(el);
    linkMap[`${lk.from}-${lk.to}`] = el;
    linkMap[`${lk.to}-${lk.from}`] = el;
  }

  // Nodes
  for (const [nidStr, info] of Object.entries(TOPOLOGY)) {
    const nid = parseInt(nidStr);
    const col = G_COLOUR[info.g] ?? '#888';
    const r   = nid === 0 ? 12 : 9;

    const g = svgEl('g', { class: 'node-g', 'data-nid': nid,
                            transform: `translate(${sx(info.x)},${sy(info.y)})` });

    const circle = svgEl('circle', { r, fill: col, stroke: '#111',
                                      'stroke-width': 1.5, opacity: 0.9 });
    const label  = svgEl('text', {
      x: 0, y: nid === 0 ? -16 : (info.y >= 0 ? -13 : 14),
      fill: '#ccc', 'font-size': 9, 'text-anchor': 'middle',
    });
    label.textContent = nid === 0 ? 'hub' : `N${nid}`;

    g.appendChild(circle);
    g.appendChild(label);
    g.addEventListener('click', () => onNodeClick(nid));
    g.title = `Node ${nid}`;
    nodesG.appendChild(g);

    nodeState[nid] = { alive: true, svgEl: circle, groupEl: g };
  }
}

// ---------------------------------------------------------------------------
// Panel
// ---------------------------------------------------------------------------
function buildPanel() {
  const list = document.getElementById('node-list');
  for (const [nidStr, info] of Object.entries(TOPOLOGY)) {
    const nid = parseInt(nidStr);
    const row = document.createElement('div');
    row.className = 'node-row';
    row.dataset.nid = nid;
    row.style.borderColor = G_COLOUR[info.g] ?? '#888';

    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:${G_COLOUR[info.g]}">${nid === 0 ? 'hub' : `N${nid}`}
          <span style="color:#444;font-size:9px">g${info.g}</span></span>
        <button class="btn" onclick="toggleNode(${nid},event)">kill</button>
      </div>
      <div class="node-val" id="val-${nid}">—</div>`;

    list.appendChild(row);
    nodeState[nid].panelEl = row;
    nodeState[nid].valEl   = document.getElementById(`val-${nid}`);
  }
}

function updatePanelVal(nid) {
  const st = nodeState[nid];
  if (!st || !st.valEl) return;
  if (st.t !== undefined)
    st.valEl.textContent = `${st.t.toFixed(1)}°C  ${st.h.toFixed(0)}%  ${st.s.toFixed(0)}% soil`;
}

// ---------------------------------------------------------------------------
// Node kill/revive
// ---------------------------------------------------------------------------
function toggleNode(nid, ev) {
  ev.stopPropagation();
  const st = nodeState[nid];
  const action = st.alive ? 'kill' : 'revive';
  ws && ws.send(JSON.stringify({ type: action, id: nid }));
}

function setAlive(nid, alive) {
  const st = nodeState[nid];
  if (!st) return;
  st.alive = alive;
  if (st.svgEl) st.svgEl.setAttribute('opacity', alive ? 0.9 : 0.2);
  if (st.panelEl) {
    st.panelEl.classList.toggle('dead', !alive);
    const btn = st.panelEl.querySelector('.btn');
    if (btn) btn.textContent = alive ? 'kill' : 'revive';
  }
}

function onNodeClick(nid) { /* future: select/highlight */ }

// ---------------------------------------------------------------------------
// Packet animation
// ---------------------------------------------------------------------------
function animateHop(fromNid, toNid, colour) {
  const a = TOPOLOGY[fromNid], b = TOPOLOGY[toNid];
  if (!a || !b) return;

  const dot = svgEl('circle', { r: 5, fill: colour, opacity: 0.9 });
  document.getElementById('anims').appendChild(dot);

  const x1 = sx(a.x), y1 = sy(a.y), x2 = sx(b.x), y2 = sy(b.y);
  const dur = 600;  // ms
  const start = performance.now();

  function frame(now) {
    const t = Math.min((now - start) / dur, 1);
    dot.setAttribute('cx', x1 + (x2 - x1) * t);
    dot.setAttribute('cy', y1 + (y2 - y1) * t);
    if (t < 1) requestAnimationFrame(frame);
    else dot.remove();
  }
  requestAnimationFrame(frame);
}

// Colour by opcode
const OP_COLOUR = {
  SENSOR_DATA:  '#f39c12',
  GRADIENT_ADV: '#3498db',
  GRADIENT_SET: '#e74c3c',
};

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------
function connect() {
  const statusEl = document.getElementById('status');

  ws = new WebSocket('ws://localhost:8765');

  ws.onopen = () => {
    statusEl.textContent = 'connected  ws://localhost:8765';
    statusEl.style.color = '#2ecc71';
  };

  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying in 3 s…';
    statusEl.style.color = '#e74c3c';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {};

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    switch (msg.type) {
      case 'topology':
        buildGraph(msg.links);
        buildPanel();
        for (const n of msg.nodes) setAlive(n.id, n.alive);
        break;

      case 'node_update': {
        const st = nodeState[msg.id];
        if (st) {
          st.t = msg.t; st.h = msg.h; st.s = msg.s;
          updatePanelVal(msg.id);
        }
        break;
      }

      case 'packet':
        animateHop(msg.from_id, msg.to_id,
                   OP_COLOUR[msg.opcode] ?? '#888');
        break;

      case 'alive':
        setAlive(msg.id, msg.alive);
        break;
    }
  };
}

connect();
</script>
</body>
</html>
